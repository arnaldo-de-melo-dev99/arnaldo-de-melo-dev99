<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Arnaldo de Melo — Software Engineer</title>
  <desc id="desc">Hero estático de portfólio com apresentação, tecnologias e retrato de Arnaldo de Melo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040615"/>
      <stop offset="0.56" stop-color="#090B20"/>
      <stop offset="1" stop-color="#110A27"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <clipPath id="portrait"><rect x="1000" y="102" width="540" height="680" rx="270"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1600" height="820" fill="url(#background)"/>
  <path d="M0 74H1600" stroke="#24213B"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F8FAFC">
    <text x="78" y="47" font-size="28" font-weight="700" fill="#A78BFA">&lt;/&gt;</text>
    <text x="128" y="46" font-size="23" font-weight="700">CodeCraft</text>
    <g font-size="15" fill="#C4C0D7">
      <text x="505" y="46">Home</text><text x="579" y="46">About</text><text x="660" y="46">Skills</text>
      <text x="741" y="46">Projects</text><text x="845" y="46">Blog</text><text x="910" y="46">Contact</text>
    </g>
    <rect x="1360" y="18" width="150" height="42" rx="7" fill="url(#button)"/>
    <text x="1392" y="45" font-size="15" font-weight="700">Hire Me ↗</text>

    <rect x="80" y="155" width="205" height="32" rx="4" fill="#211A42"/>
    <text x="94" y="177" font-size="13" letter-spacing="1.5" fill="#C4B5FD">I'M A SOFTWARE ENGINEER</text>
    <text x="80" y="260" font-size="56" font-weight="700">Olá, sou <tspan fill="#A78BFA">Arnaldo</tspan></text>
    <text x="80" y="326" font-size="55" font-weight="700">Construo para a web.</text>
    <text x="80" y="376" font-size="19" fill="#B8B5C7">Desenvolvedor focado em produtos digitais modernos,</text>
    <text x="80" y="404" font-size="19" fill="#B8B5C7">experiências rápidas e sistemas que crescem.</text>
    <rect x="80" y="445" width="174" height="54" rx="7" fill="url(#button)"/>
    <text x="108" y="478" font-size="16" font-weight="700">Ver projetos ↗</text>
    <rect x="272" y="445" width="160" height="54" rx="7" fill="none" stroke="#77718C"/>
    <text x="299" y="478" font-size="16" font-weight="700">Contacto</text>
    <text x="80" y="560" font-size="13" letter-spacing="1.4" fill="#A8A2B8">TECNOLOGIAS COM QUE TRABALHO</text>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18">
      <rect x="80" y="585" width="42" height="42" rx="7" fill="#E34F26"/><text x="89" y="613">H</text>
      <rect x="138" y="585" width="42" height="42" rx="7" fill="#1572B6"/><text x="148" y="613">C</text>
      <rect x="196" y="585" width="42" height="42" rx="7" fill="#F7DF1E" fill-opacity="0.96"/><text x="205" y="613" fill="#111827">JS</text>
      <rect x="254" y="585" width="42" height="42" rx="7" fill="#3178C6"/><text x="264" y="613">TS</text>
      <rect x="312" y="585" width="42" height="42" rx="7" fill="#61DAFB"/><text x="321" y="613" fill="#111827">R</text>
      <rect x="370" y="585" width="42" height="42" rx="7" fill="#339933"/><text x="379" y="613">N</text>
    </g>
  </g>

  <circle cx="1215" cy="394" r="292" fill="#7C3AED" opacity=".16" filter="url(#glow)"/>
  <circle cx="1215" cy="394" r="266" fill="url(#purple)" opacity=".92"/>
  <image href="../assets/arnaldo.png" x="350" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)" opacity=".98"/>
  <path d="M965 635c-43-9-74-40-80-81m0 0 23 18m-23-18 18-22" fill="none" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="1240" y="365" width="285" height="210" rx="12" fill="#111426" stroke="#3B3557"/>
    <circle cx="1264" cy="390" r="5" fill="#A78BFA"/><text x="1280" y="396" font-size="13" fill="#D8B4FE">code</text>
    <circle cx="1497" cy="390" r="5" fill="#4ADE80"/>
    <text x="1264" y="430" font-size="13" fill="#C4B5FD">const developer = {</text>
    <text x="1280" y="456" font-size="12" fill="#E2E8F0">name: <tspan fill="#F9A8D4">'Arnaldo'</tspan>,</text>
    <text x="1280" y="480" font-size="12" fill="#E2E8F0">skills: <tspan fill="#F9A8D4">['Web', 'DevOps']</tspan>,</text>
    <text x="1280" y="504" font-size="12" fill="#E2E8F0">passion: <tspan fill="#F9A8D4">'build useful things'</tspan></text>
    <text x="1264" y="540" font-size="13" fill="#C4B5FD">};</text>
  </g>
  <rect x="80" y="716" width="1440" height="1" fill="#29243D"/>
  <text x="80" y="762" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#AAA4BA">Software Engineer · DevOps · SEO</text>
  <text x="1321" y="762" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#AAA4BA">arnaldo-de-melo-dev99</text>
</svg>
